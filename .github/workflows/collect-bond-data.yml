name: Collect global bond data

# 미국 채권시장이 닫힌 직후. 서머타임 때문에 크론이 두 벌이다 —
#   20:05 UTC = 16:05 ET (여름, EDT) = 05:05 KST
#   21:05 UTC = 16:05 ET (겨울, EST) = 06:05 KST
# 러너는 어느 쪽이 «마감 직후»인지 모르므로 둘 다 뜨고, 스크립트가 AGG 종가가
# 닫힌 마지막 세션을 기준일로 잡아 같은 날 두 번 돌아도 한 번만 커밋되게 한다.
on:
  schedule:
    - cron: '5 20 * * 1-5'
    - cron: '5 21 * * 1-5'
  workflow_dispatch:
    inputs:
      force:
        description: '휴장에도 수집'
        type: boolean
        default: false
      report_date:
        description: '기준일 고정 (YYYY-MM-DD)'
        type: string

concurrency:
  group: bond-data
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install CJK font (chart labels)
        # 커브 차트의 축·범례가 한글이다. 폰트가 없으면 DejaVu Sans 로 떨어져
        # 「미국·독일·일본」이 두부(□)로 렌더된다 (2026-09-01 실행 로그의 Glyph missing 경고).
        run: sudo apt-get update -qq && sudo apt-get install -y -qq fonts-noto-cjk

      - name: Install dependencies
        # matplotlib 하한 — Noto CJK 는 .ttc 묶음이고 그 안의 서브폰트 해석이
        # 3.11 부터 안정적이다. 미고정으로 두면 조용히 두부로 되돌아간다.
        run: pip install --quiet yfinance certifi pandas 'matplotlib>=3.11' pytest

      # 수집보다 먼저 돈다 — 뒤에 두면 테스트가 깨진 날 수집분까지 통째로 버려진다
      # (2026-09-01: pytest 미설치로 Unit tests 가 죽으면서 Commit 이 실행되지 않았다).
      - name: Unit tests
        run: python3 -m pytest scripts/bond scripts/common -q

      - name: Collect
        # ECOS 는 인증키를 URL 경로에 넣는다. env 로만 주입하고 로그에는 절대 찍지 않는다
        # (scripts/kr/econ.py 의 scrub() 이 예외 문자열까지 가린다).
        env:
          ECOS_API_KEY: ${{ secrets.ECOS_API_KEY }}
        run: |
          ARGS=""
          if [ -n "${{ inputs.report_date }}" ]; then
            ARGS="--report-date ${{ inputs.report_date }}"
          fi
          python3 scripts/collect_bond_data.py --outdir bond/data $ARGS

      - name: Draw curves
        run: |
          python3 - <<'PY'
          import json, sys
          sys.path.insert(0, 'scripts')
          from bond.charts import draw
          m = json.load(open('bond/data/bond_metrics.json'))
          draw(m['curves'], 'bond/data/yield_curves.png', m['report_date'])
          PY

      - name: Commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add bond/data
          if git diff --staged --quiet; then
            echo "변경 없음 — 커밋 생략"
          else
            DATE=$(python3 -c "import json;print(json.load(open('bond/data/bond_market.json'))['report_date'])")
            git commit -m "채권 데이터 수집 — $DATE"
            git pull --rebase --autostash
            git push
          fi
