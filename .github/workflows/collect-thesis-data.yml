name: Collect thesis watch data

# 평일 17:40 KST — KR 수집(17:00·17:30) 이후, 감시 루틴(19:00 KST) 이전.
# 이 시각이면 삼성·하이닉스의 당일 종가와 Micron의 전 거래일 종가가 모두 확정돼 있다.
on:
  schedule:
    - cron: '40 17 * * 1-5'
      timezone: 'Asia/Seoul'
  workflow_dispatch:
    inputs:
      force:
        description: '주말·휴장에도 수집'
        type: boolean
        default: false

concurrency:
  group: thesis-data
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        # 예약 실행은 만들어질 때의 커밋에 고정된다 — concurrency 로 줄 서 있다가 앞 실행이 push 한 뒤
        # 시작해도 옛 커밋을 받아, 같은 파일을 옛 내용 위에 다시 써 rebase 충돌로 수집분을 버린다
        # (2026-09-24 run 35935382006). 시작 시점의 main 을 받는다.
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install --quiet yfinance certifi pandas pytest

      # 손편집 탐지는 **수집 전**에만 가능하다. 커밋된 페이지는 커밋된 데이터로 렌더한
      # 결과와 같아야 한다. 수집 후에 대조하면 그날의 정상적인 시세 변화까지 «다르다»로
      # 나오고, 렌더를 먼저 돌리면 손편집을 잡는 게 아니라 덮어써 버린다.
      # 템플릿 전환은 감사한 이전 페이지·데이터의 정확한 해시 조합만 허용한다.
      # 임의 손편집이나 다른 데이터 조합은 예외가 아니다.
      - name: Check pages were not hand-edited
        id: handedit
        continue-on-error: true
        run: python3 scripts/build_thesis_pages.py --data thesis/data --out thesis --check --allow-template-transition

      - name: Collect
        # DART 인증키는 **쿼리스트링**에 들어간다(ECOS는 URL 경로 — scrub 패턴이 다르다).
        # thesis/disclosure.py 의 scrub()을 거치지 않은 URL·예외를 절대 출력하지 말 것.
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
        run: |
          python3 scripts/collect_thesis_data.py \
            ${{ inputs.force && '--force' || '' }} \
            --out thesis/data

      # 페이지는 산문(content.py)과 오늘 수치(watch.json)로 결정론적으로 렌더된다.
      # 여기서 매일 다시 만들지 않으면 페이지가 마지막 사건 때의 수치에 멈춘다 —
      # 2026-08-25에 삼성 페이지가 사흘 낡은 281,500원·「관심선 위」를 띄우고 있었다.
      # 판단은 들어가지 않는다. 등급·산문은 루틴만 바꾼다.
      - name: Rebuild pages
        run: python3 scripts/build_thesis_pages.py --data thesis/data --out thesis

      - name: Commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add thesis/data/ thesis/*.html thesis/index.json
          bash scripts/ci/push_with_retry.sh "thesis watch data $(TZ=Asia/Seoul date +%Y-%m-%d)"

      # 테스트는 **커밋 뒤**에 돈다. 2026-09-01 채권 워크플로가 pytest 미설치로 죽으면서
      # 그날 모은 수집분을 통째로 버린 전례가 있다 — 검사 실패는 빨간 실행으로 남기되
      # 데이터는 이미 레포에 들어가 있어야 한다.
      - name: Unit tests
        run: python3 -m pytest scripts/thesis scripts/common -q

      # 데이터는 커밋해 두고, 손편집이 있었다는 사실은 빨간 실행으로 남긴다.
      - name: Fail if pages had been hand-edited
        if: steps.handedit.outcome == 'failure'
        run: |
          echo "커밋돼 있던 thesis 페이지가 렌더 결과와 달랐다 — 누군가 HTML을 직접 고쳤다." >&2
          echo "이 실행이 덮어썼으므로 원본은 직전 커밋에 있다." >&2
          exit 1
