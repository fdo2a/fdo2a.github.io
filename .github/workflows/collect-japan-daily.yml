name: Collect Japan daily

# 일본 일간 마감브리프의 원자료 — 일경 공식 CSV·yfinance·MOF·BOJ API·Yahoo!ファイナンス 뉴스(16:30 JST 컷).
# 루틴 환경은 이 호스트들에 닿지 못한다 — 수집 후보 japan/data/daily/candidate/<session>.json 은 여기서만 만든다.
# 예약 실행은 2~5시간 밀리므로(AGENTS.md 규칙 10) 루틴이 세션·nonce 를 넣어 직접 띄운다.
# 발행된 세션은 수집기가 덮지 않는다. 설계 docs/superpowers/specs/2026-10-27-japan-daily-design.md §13
run-name: "japan daily ${{ inputs.session || 'scheduled' }} ${{ inputs.nonce }}"
on:
  schedule:
    - cron: '30 16 * * 1-5'
      timezone: 'Asia/Tokyo'
  workflow_dispatch:
    inputs:
      session:
        description: 'Tokyo session YYYY-MM-DD. Empty = routine_due.py jp-session'
        type: string
        default: ''
      nonce:
        description: 'Caller tag so a routine can find this run (shown in the run name)'
        type: string
        default: ''

permissions:
  contents: write
  # 뉴스 요약의 Claude API 인증 = Workload Identity Federation — 일본 뉴스 잡과 같은 Variables.
  id-token: write

concurrency:
  group: collect-japan-daily
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install deps
        run: pip install --quiet yfinance pandas requests certifi curl_cffi pypdf pytest 'anthropic>=1.8,<2'
      - name: Run unit tests
        run: python -m pytest scripts/japan/tests scripts/common/tests/test_routine_due_jp_daily.py -q
      - name: Resolve session
        id: when
        env:
          IN_SESSION: ${{ inputs.session }}
        run: |
          read -r AUTO PREV_AUTO < <(python scripts/ci/routine_due.py jp-session)
          S="${IN_SESSION:-$AUTO}"
          [[ "$S" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]] || { echo "bad session: $S"; exit 1; }
          if [ "$S" = "$AUTO" ]; then P="$PREV_AUTO"; else
            P=$(python -c "import sys; sys.path.insert(0,'scripts/ci'); import routine_due as r; print(r.jp_prev_session('$S', r._holidays('jp')))")
          fi
          echo "session=$S" >> "$GITHUB_OUTPUT"
          echo "prev=$P" >> "$GITHUB_OUTPUT"
          echo "session=$S prev=$P"
      - name: Fetch daily news
        continue-on-error: true
        env:
          ANTHROPIC_FEDERATION_RULE_ID: ${{ vars.ANTHROPIC_FEDERATION_RULE_ID }}
          ANTHROPIC_ORGANIZATION_ID: ${{ vars.ANTHROPIC_ORGANIZATION_ID }}
          ANTHROPIC_SERVICE_ACCOUNT_ID: ${{ vars.ANTHROPIC_SERVICE_ACCOUNT_ID }}
          ANTHROPIC_WORKSPACE_ID: ${{ vars.ANTHROPIC_WORKSPACE_ID }}
          NEWS_SUMMARY_MODEL: ${{ vars.NEWS_SUMMARY_MODEL }}
          S: ${{ steps.when.outputs.session }}
        run: python scripts/fetch_japan_news.py --datadir japan/data --bodydir _workspace/japan_news --daily-session "$S"
      - name: Collect
        env:
          S: ${{ steps.when.outputs.session }}
          P: ${{ steps.when.outputs.prev }}
        run: python scripts/collect_japan_daily.py --session "$S" --prev "$P" --scheduled-at "${{ github.event_name }}"
      - name: Commit data
        if: always()
        env:
          S: ${{ steps.when.outputs.session }}
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add japan/data/daily japan/data/news/daily 2>/dev/null || true
          git diff --cached --quiet && { echo "nothing to commit"; exit 0; }
          bash scripts/ci/push_with_retry.sh "data: japan daily ${S}"
