name: Publish watch (alerts)

# 발행 건별 알림의 계산(2.5단계, 2026-11-10). 여기서는 사건을 **계산만** 한다 — 텔레그램 토큰은 이 레포 어디에도 없고,
# 전송은 공개 레포 밖 Cloudflare Worker 가 한다. 결과는 상태 브랜치 `alerts-state` 의 `verify_publish.json`(계산 상태)·
# `outbox.json`(보낼 사건)에 한 커밋으로 올라간다. 그 push 는 main 이 아니고 GITHUB_TOKEN 이라 이 작업 흐름을 다시 깨우지 않는다.
# 설계: docs/superpowers/specs/2026-11-08-telegram-prepub-records.md (2.5단계 절)
on:
  push:
    branches: [main]
    paths:
      - 'posts/**'
      - 'kr/posts/**'
      - 'verification/**'
  schedule:
    # 세션 기준 시각 맞춤(분은 정각 회피). UTC 로 적는다 — KST = UTC+9.
    - cron: '10 3 * * *'     # 12:10 KST — US 세션 기준(12:00) 직후
    - cron: '40 4 * * *'     # 13:40 KST — US 재확인
    - cron: '10 14 * * *'    # 23:10 KST — KR 세션 기준(23:00) 직후
    - cron: '40 15 * * *'    # 00:40 KST — KR 재확인
    # 심장 박동: outbox 의 last_ok 를 3시간마다 갱신한다. Worker 는 9시간 넘게 멈추면 「계산 멈춤」을 알린다.
    # 예약 실행은 2~5시간 늦게 올 수 있다 — 시각을 옮겨도 해결되지 않는다.
    - cron: '37 */3 * * *'
  workflow_dispatch:

# 상태 브랜치 push 만. 비밀값(secrets.*)을 쓰지 않는다 — 이 파일은 AI 가 고칠 수 있는 자리다.
permissions:
  contents: write

# 대기 중 실행이 새 실행에 밀려 취소돼도 괜찮다 — 매 실행이 마지막 기준점 커밋부터 다시 훑는다.
concurrency:
  group: publish-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          # 줄 서 있다가 시작해도 최신 계산 코드를 쓴다. 계산 대상은 스크립트가 origin/main 을 직접 받아 정한다.
          ref: main
          # 기준점 커밋부터의 변경·글을 처음 담은 커밋을 이력에서 찾는다 — 얕은 checkout 에는 없다.
          fetch-depth: 0
      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Compute events and push state
        # 표준 라이브러리만(pip 없음), 러너의 python3. Worker 주소는 레포 변수(비밀 아님) — 비어 있으면 poke 와
        # 전송 확인 읽기를 건너뛰고, outbox 에서 아무것도 빼지 않는다.
        env:
          ALERTS_WORKER_URL: ${{ vars.ALERTS_WORKER_URL }}
        run: python3 scripts/verify_publish.py --github
