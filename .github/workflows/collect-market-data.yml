name: Collect market data

# Fetches canonical US market data (yfinance + FRED) in this network-open runner
# and commits data/market_data.json, data/intraday.json, data/yield_curve.png.
# The cloud routine (network-restricted) then reads those files instead of scraping
# the web — making STEP 1 deterministic instead of a best-effort search game.

on:
  schedule:
    # 발행용 커브를 네이버 국채 «종가»로 바꾸면서(2026-09-04) 수집이 국채 현물
    # 마감(17:05 ET) 뒤로 와야 한다. 예전 두 번째 슬롯 15:22 UTC 는 겨울에 17:15 EST
    # 로 마감 10분 뒤라 마진이 없었다. 이제 두 슬롯 모두 **17:30 ET** 다 —
    # 여름(EDT) 06:30 KST · 겨울(EST) 07:30 KST(다음 날 아침, 화~토). KST 는 서머타임이
    # 없으므로 두 벌을 띄우고, 같은 report_date 가 이미 완전하면 두 번째가 무동작으로 끝난다.
    - cron: '30 6 * * 2-6'
      timezone: 'Asia/Seoul'
    - cron: '30 7 * * 2-6'
      timezone: 'Asia/Seoul'
  workflow_dispatch:
    inputs:
      force:
        description: 'Regenerate even if a complete dataset for the same report date exists'
        type: boolean
        default: false
      fred_check:
        description: '수집 대신 FRED 공식 API 와 graph CSV 를 대조만 하고 끝낸다 (아무것도 커밋하지 않는다)'
        type: boolean
        default: false

permissions:
  contents: write
  # 뉴스 요약의 Claude API 인증 = Workload Identity Federation (2026-09-24). 레포에 정적 키를
  # 두지 않고 이 잡의 GitHub OIDC 토큰을 Anthropic 토큰으로 교환한다.
  id-token: write

concurrency:
  group: collect-market-data
  cancel-in-progress: false

jobs:
  # 키는 레포 시크릿에만 있고 로컬 셸에는 없다 — 전송을 바꾼 뒤 «같은 숫자인가» 를
  # 물을 수 있는 자리가 여기뿐이라 진단을 워크플로에 둔다. 아무것도 쓰지 않고,
  # 불일치가 하나라도 남으면 빨간 실행으로 끝난다.
  fred_check:
    if: github.event.inputs.fred_check == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --quiet certifi
      - name: Compare official API against the graph CSV
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python scripts/collect_market_data.py --fred-check

  collect:
    if: github.event.inputs.fred_check != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        # 예약 실행은 만들어질 때의 커밋에 고정된다 — concurrency 로 줄 서 있다가 앞 실행이 push 한 뒤
        # 시작해도 옛 커밋을 받아, 같은 파일을 옛 내용 위에 다시 써 rebase 충돌로 수집분을 버린다
        # (2026-09-24 run 35935382006). 시작 시점의 main 을 받는다.
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install CJK font (for chart labels)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq fonts-noto-cjk

      - name: Install Python deps
        run: pip install --quiet yfinance pandas lxml matplotlib certifi 'curl_cffi>=0.15.0' pypdf

      - name: Collect
        id: collect
        # FRED_API_KEY 는 **스텝 단위**로만 준다(ECOS 선례). 키가 없거나 거부당하면
        # 수집기가 예전 graph CSV 로 내려가 그대로 발행한다 — 데이터는 절대 안 멈춘다.
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: |
          python scripts/collect_market_data.py --outdir data ${{ (github.event_name == 'workflow_dispatch' && inputs.force) && '--force' || '' }}

      - name: Evaluate macro regime
        if: steps.collect.outputs.skipped != 'true'
        # Non-core: judges yesterday's macro book
        # against today's axis scores so §8 inherits a regime instead of re-reading the
        # cycle every morning. Never fail the collection job on it.
        continue-on-error: true
        run: python scripts/eval_macro_regime.py --datadir data

      - name: Fetch primary releases
        if: steps.collect.outputs.skipped != 'true'
        # Non-core: pulls the actual press release behind each promoted indicator so the
        # routine reads the document rather than paraphrasing a dashboard row. The
        # agencies 403 ordinary clients, hence the TLS impersonation in the script.
        # Never fail the collection job on it.
        continue-on-error: true
        run: python scripts/fetch_releases.py --datadir data

      - name: Fetch market news
        if: steps.collect.outputs.skipped != 'true'
        # Non-core (2026-09-19 사용자 지시, 2026-09-24 갈래 개편): CNBC·Yahoo 피드를 받아
        # 정치·경제·매크로·산업·AI 로 분류해 추린 뒤 기사 본문까지 읽어 온다. 2026-09-26 부터
        # 글로벌(CNBC 세계·Investing.com 의 로이터 전재·가디언·알자지라·BBC·ECB·BoE)과
        # 리포트·칼럼(ING THINK·BIS 연설·ECB 블로그·Investing.com 분석)도 받는다. 에이전트 웹서치로
        # 뉴스를 모으면 발행본에 실린 기사가 실재했는지 사후에 확인할 방법이 없는데, 파일로
        # 커밋하면 check_news.py 가 대조할 수 있다 — 지어낸 헤드라인이 막힌다.
        # 본문은 _workspace/ (gitignore) 에만 떨어뜨리고, **여기서 한국어 요약(summary_ko)
        # 까지 만들어** 요약만 커밋한다: 이 레포는 공개이고 기사는 상업 저작물이며, 클라우드
        # 루틴은 CNBC·Yahoo 에 403 이라 본문을 다시 받을 수 없다(2026-09-24 실측).
        # 인증은 WIF 다 — ID 넷(규칙·조직·서비스 계정·워크스페이스)은 비밀이 아니라 레포 Variables 에
        # 둔다. 규칙이 워크스페이스 하나여도 워크스페이스 ID 가 없으면 교환이 401 이다(2026-09-24 실측).
        # GitHub OIDC 토큰은 약 5분짜리 1회용이라 파일로 미리 받아 두지 않는다 —
        # news_summary 가 SDK 에 공급자 함수를 넘겨, 교환할 때마다 새 토큰을 받는다.
        # 값이 없으면 요약 없이 커밋되고 그날 뉴스 섹션은 빠진다(수집분은 남는다).
        # 피드가 죽으면 그날 뉴스 섹션이 빠질 뿐이므로 수집 잡을 세우지 않는다.
        continue-on-error: true
        env:
          ANTHROPIC_FEDERATION_RULE_ID: ${{ vars.ANTHROPIC_FEDERATION_RULE_ID }}
          ANTHROPIC_ORGANIZATION_ID: ${{ vars.ANTHROPIC_ORGANIZATION_ID }}
          ANTHROPIC_SERVICE_ACCOUNT_ID: ${{ vars.ANTHROPIC_SERVICE_ACCOUNT_ID }}
          ANTHROPIC_WORKSPACE_ID: ${{ vars.ANTHROPIC_WORKSPACE_ID }}
          NEWS_SUMMARY_MODEL: ${{ vars.NEWS_SUMMARY_MODEL }}
        run: |
          pip install --quiet 'anthropic>=1.8,<2'
          RD=$(python -c "import json;print(json.load(open('data/market_data.json'))['report_date'])" 2>/dev/null || date -u +%F)
          python scripts/fetch_news.py --datadir data --bodydir _workspace/news --date "$RD"

      - name: Fetch Fed events
        if: steps.collect.outputs.skipped != 'true'
        # Non-core: finds today's FOMC statement / chair speech / Jackson Hole remarks and
        # commits the primary documents verbatim, so the publication gate can check every
        # quoted sentence against what was actually said. A fabricated Fed quote is worse
        # than a fabricated number — a number can be matched against a data file, a
        # plausible sentence in quotation marks cannot. Never fail the collection job.
        continue-on-error: true
        run: python scripts/collect_fed_events.py --datadir data

      - name: Build the next-ten-days calendar
        if: steps.collect.outputs.skipped != 'true'
        # Non-core, same contract: what is coming (economic releases, Treasury auctions,
        # index expiry, the Fed blackout) plus the demand behind the auctions that just
        # cleared. Everything the report carried about "next" used to be web-search prose
        # with no prior value and no gate. A failure here costs the card, not the dataset,
        # and a material it could not reach is recorded in `missing` rather than invented.
        # FRED_API_KEY is step-scoped like every other key here; without it the release
        # calendar is simply absent (the graph-CSV fallback has no release table).
        continue-on-error: true
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python scripts/build_calendar.py --datadir data

      - name: Report status
        run: |
          python - <<'PY'
          import json
          d = json.load(open('data/market_data.json'))
          print(f"report_date={d['report_date']} complete={d['complete']}")
          if d['missing']:
              print('missing:', ', '.join(d['missing']))
          f = d.get('fred') or {}
          print(f"fred: transport={f.get('transport')} reason={f.get('reason')} "
                f"requests={f.get('requests')} series={f.get('series_ok')}")
          for label in ('failed', 'csv_rescued'):
              if f.get(label):
                  print(f'::warning::fred {label}: ' + ', '.join(f[label]))
          PY

      - name: Commit data
        if: steps.collect.outputs.skipped != 'true'
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add data/market_data.json data/intraday.json data/econ_indicators.json data/sector_performance.html
          git add data/yield_curve.png 2>/dev/null || true
          git add data/movers.json 2>/dev/null || true
          git add data/macro_metrics.json data/macro_eval.json 2>/dev/null || true
          git add data/scorecard.json 2>/dev/null || true
          git add data/calendar.json 2>/dev/null || true
          git add data/releases 2>/dev/null || true
          git add data/news 2>/dev/null || true
          git add data/fed 2>/dev/null || true
          git add data/history 2>/dev/null || true
          git add data/weekly data/monthly 2>/dev/null || true
          RD=$(python -c "import json;print(json.load(open('data/market_data.json'))['report_date'])")
          bash scripts/ci/push_with_retry.sh "data: market data for ${RD}"

      # 키가 설정됐는데 거부당했으면 빨간 실행으로 남긴다. **커밋 뒤**인 이유는
      # 폴백 데이터가 이미 레포에 들어가 있어야 하기 때문이다 — 죽은 키가 몇 주 동안
      # 조용히 지나가는 것만 막으면 된다.
      - name: FRED key health
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: |
          python - <<'PY'
          import json, os, sys
          f = (json.load(open('data/market_data.json')).get('fred') or {})
          if os.environ.get('FRED_API_KEY') and f.get('degraded'):
              print(f"::error::FRED API key configured but unused ({f.get('reason')}) — "
                    f"data was collected from the unofficial graph CSV")
              sys.exit(1)
          print(f"fred transport={f.get('transport')} ok")
          PY
