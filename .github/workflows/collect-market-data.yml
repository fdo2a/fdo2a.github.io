name: Collect market data

# Fetches canonical US market data (yfinance + FRED) in this network-open runner
# and commits data/market_data.json, data/intraday.json, data/yield_curve.png.
# The cloud routine (network-restricted) then reads those files instead of scraping
# the web — making STEP 1 deterministic instead of a best-effort search game.

on:
  schedule:
    # 발행용 커브를 네이버 국채 «종가»로 바꾸면서(2026-09-04) 수집이 국채 현물
    # 마감(17:05 ET) 뒤로 와야 한다. 예전 두 번째 슬롯 15:22 UTC 는 겨울에 17:15 EST
    # 로 마감 10분 뒤라 마진이 없었다. 이제 두 슬롯 모두 **17:30 ET** 다 —
    # 여름(EDT) 21:30 UTC · 겨울(EST) 22:30 UTC. 크론은 서머타임을 모르므로 두 벌을
    # 띄우고, 같은 report_date 가 이미 완전하면 두 번째가 무동작으로 끝난다.
    - cron: '30 21 * * 1-5'
    - cron: '30 22 * * 1-5'
  workflow_dispatch:
    inputs:
      force:
        description: 'Regenerate even if a complete dataset for the same report date exists'
        type: boolean
        default: false
      fred_check:
        description: '수집 대신 FRED 공식 API 와 graph CSV 를 대조만 하고 끝낸다 (아무것도 커밋하지 않는다)'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: collect-market-data
  cancel-in-progress: false

jobs:
  # 키는 레포 시크릿에만 있고 로컬 셸에는 없다 — 전송을 바꾼 뒤 «같은 숫자인가» 를
  # 물을 수 있는 자리가 여기뿐이라 진단을 워크플로에 둔다. 아무것도 쓰지 않고,
  # 불일치가 하나라도 남으면 빨간 실행으로 끝난다.
  fred_check:
    if: github.event.inputs.fred_check == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --quiet certifi
      - name: Compare official API against the graph CSV
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python scripts/collect_market_data.py --fred-check

  collect:
    if: github.event.inputs.fred_check != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install CJK font (for chart labels)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq fonts-noto-cjk

      - name: Install Python deps
        run: pip install --quiet yfinance pandas matplotlib certifi 'curl_cffi>=0.15.0' pypdf

      - name: Collect
        # FRED_API_KEY 는 **스텝 단위**로만 준다(ECOS 선례). 키가 없거나 거부당하면
        # 수집기가 예전 graph CSV 로 내려가 그대로 발행한다 — 데이터는 절대 안 멈춘다.
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: |
          python scripts/collect_market_data.py --outdir data ${{ (github.event_name == 'workflow_dispatch' && inputs.force) && '--force' || '' }}

      - name: Evaluate stance triggers
        # Non-core: judges yesterday's committed stance against today's metrics so the
        # routine's §8 inherits a position instead of re-deriving one from the tape.
        # Never fail the collection job on it.
        continue-on-error: true
        run: python scripts/eval_stance_triggers.py --datadir data

      - name: Roll the paper portfolio
        # Non-core, same contract: turns yesterday's committed grades into today's
        # weights and marks the book to today's close. The routine renders the result
        # and does no arithmetic of its own. A failure here costs the section, not the
        # dataset — check_portfolio.py then publishes without it.
        continue-on-error: true
        run: python scripts/build_portfolio.py --datadir data

      - name: Evaluate macro regime
        # Non-core, same contract as the stance step: judges yesterday's macro book
        # against today's axis scores so §8 inherits a regime instead of re-reading the
        # cycle every morning. Never fail the collection job on it.
        continue-on-error: true
        run: python scripts/eval_macro_regime.py --datadir data

      - name: Fetch primary releases
        # Non-core: pulls the actual press release behind each promoted indicator so the
        # routine reads the document rather than paraphrasing a dashboard row. The
        # agencies 403 ordinary clients, hence the TLS impersonation in the script.
        # Never fail the collection job on it.
        continue-on-error: true
        run: python scripts/fetch_releases.py --datadir data

      - name: Fetch Fed events
        # Non-core: finds today's FOMC statement / chair speech / Jackson Hole remarks and
        # commits the primary documents verbatim, so the publication gate can check every
        # quoted sentence against what was actually said. A fabricated Fed quote is worse
        # than a fabricated number — a number can be matched against a data file, a
        # plausible sentence in quotation marks cannot. Never fail the collection job.
        continue-on-error: true
        run: python scripts/collect_fed_events.py --datadir data

      - name: Report status
        run: |
          python - <<'PY'
          import json
          d = json.load(open('data/market_data.json'))
          print(f"report_date={d['report_date']} complete={d['complete']}")
          if d['missing']:
              print('missing:', ', '.join(d['missing']))
          f = d.get('fred') or {}
          print(f"fred: transport={f.get('transport')} reason={f.get('reason')} "
                f"requests={f.get('requests')} series={f.get('series_ok')}")
          for label in ('failed', 'csv_rescued'):
              if f.get(label):
                  print(f'::warning::fred {label}: ' + ', '.join(f[label]))
          PY

      - name: Commit data
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add data/market_data.json data/intraday.json data/econ_indicators.json data/sector_performance.html
          git add data/yield_curve.png data/stance_metrics.json data/stance_eval.json 2>/dev/null || true
          git add data/portfolio.json data/portfolio_state.json data/portfolio_prices.json 2>/dev/null || true
          git add data/macro_metrics.json data/macro_eval.json 2>/dev/null || true
          git add data/scorecard.json 2>/dev/null || true
          git add data/releases 2>/dev/null || true
          git add data/fed 2>/dev/null || true
          git add data/history 2>/dev/null || true
          git add data/weekly data/monthly 2>/dev/null || true
          RD=$(python -c "import json;print(json.load(open('data/market_data.json'))['report_date'])")
          bash scripts/ci/push_with_retry.sh "data: market data for ${RD}"

      # 키가 설정됐는데 거부당했으면 빨간 실행으로 남긴다. **커밋 뒤**인 이유는
      # 폴백 데이터가 이미 레포에 들어가 있어야 하기 때문이다 — 죽은 키가 몇 주 동안
      # 조용히 지나가는 것만 막으면 된다.
      - name: FRED key health
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: |
          python - <<'PY'
          import json, os, sys
          f = (json.load(open('data/market_data.json')).get('fred') or {})
          if os.environ.get('FRED_API_KEY') and f.get('degraded'):
              print(f"::error::FRED API key configured but unused ({f.get('reason')}) — "
                    f"data was collected from the unofficial graph CSV")
              sys.exit(1)
          print(f"fred transport={f.get('transport')} ok")
          PY
