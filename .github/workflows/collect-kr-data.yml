name: Collect KR market data

# 한국장 마감(15:30 KST) 후 저녁 브리프(18:00 KST) 전에 데이터 확정.
# 17:00·17:30 KST. 두 슬롯은 회복탄력성용. 크론은 KST 로 적는다(timezone 필드).
on:
  schedule:
    - cron: '0 17 * * 1-5'
      timezone: 'Asia/Seoul'
    - cron: '30 17 * * 1-5'
      timezone: 'Asia/Seoul'
  workflow_dispatch:
    inputs:
      force:
        description: 'Regenerate even if a complete dataset exists'
        type: boolean
        default: false

permissions:
  contents: write
  # 뉴스 요약의 Claude API 인증 = Workload Identity Federation — US 수집 잡과 같은 규칙·
  # Variables 를 쓴다(`collect-market-data.yml`). GitHub OIDC 토큰을 교환한다.
  id-token: write

concurrency:
  group: collect-kr-data
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        # 예약 실행은 만들어질 때의 커밋에 고정된다 — concurrency 로 줄 서 있다가 앞 실행이 push 한 뒤
        # 시작해도 옛 커밋을 받아, 같은 파일을 옛 내용 위에 다시 써 rebase 충돌로 수집분을 버린다
        # (2026-09-24 run 35935382006). 시작 시점의 main 을 받는다.
        with:
          ref: main
          # 판 관리(scripts/common/versions.py)가 발행 커밋 P 를 이력에서 찾는다 — 얕은 checkout 에는 없다.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install CJK font (chart labels)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq fonts-noto-cjk
      - name: Install deps
        run: pip install --quiet yfinance pandas requests beautifulsoup4 lxml matplotlib pytest
      - name: Run unit tests
        run: python -m pytest scripts/kr/tests -q
      - name: Collect
        # ECOS 인증키는 URL 경로에 들어가므로 로그 유출에 주의 — kr/econ.py가 scrub()로 마스킹한다.
        env:
          ECOS_API_KEY: ${{ secrets.ECOS_API_KEY }}
        run: python scripts/collect_kr_data.py --outdir kr/data
      - name: Fetch news (non-core)
        # 네이버증권 주요뉴스 → kr/data/news/<date>.json (2026-09-24). 본문은 _workspace/ 에만 두고
        # 여기서 한국어 요약(summary_ko)까지 만들어 요약만 커밋한다 — 기사는 상업 저작물이고
        # 이 레포는 공개다. 발행 게이트 `check_news.py --market kr` 가 발행본을 이 파일과 대조한다.
        # WIF ID 넷(규칙·조직·서비스 계정·워크스페이스)은 US 와 같은 레포 Variables — 워크스페이스
        # ID 가 없으면 교환이 401 이다. 실패해도 그날 KR 뉴스 섹션만 빠진다.
        continue-on-error: true
        env:
          ANTHROPIC_FEDERATION_RULE_ID: ${{ vars.ANTHROPIC_FEDERATION_RULE_ID }}
          ANTHROPIC_ORGANIZATION_ID: ${{ vars.ANTHROPIC_ORGANIZATION_ID }}
          ANTHROPIC_SERVICE_ACCOUNT_ID: ${{ vars.ANTHROPIC_SERVICE_ACCOUNT_ID }}
          ANTHROPIC_WORKSPACE_ID: ${{ vars.ANTHROPIC_WORKSPACE_ID }}
          NEWS_SUMMARY_MODEL: ${{ vars.NEWS_SUMMARY_MODEL }}
          # 국내/해외 필터(common/region_filter.py) — 없으면 정규식만, 오늘과 같다. 이 단계에만 들어간다
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
        run: |
          pip install --quiet certifi 'anthropic>=1.8,<2'
          RD=$(python -c "import json;print(json.load(open('kr/data/kr_market_data.json'))['report_date'])")
          python scripts/fetch_kr_news.py --datadir kr/data --bodydir _workspace/kr_news --date "$RD"
      - name: Fetch Telegram channels (non-core)
        # 텔레그램 공개 채널 8개 → kr/data/telegram/<date>.json (2026-11-06 사용자 지시 — 증권사 글은 그 증권사
        # 견해로, 나머지는 「이런 의견도 있었다」·원문 출처로 인용). 원문은 _workspace/ 에만, 요약만 커밋한다.
        # 요약이 있는 날 파일은 동결된다(17:30 재수집이 17:00 판을 바꾸지 않는다). 실패해도 브리프는 그대로.
        # 설계: docs/superpowers/specs/2026-11-06-telegram-source.md
        continue-on-error: true
        env:
          ANTHROPIC_FEDERATION_RULE_ID: ${{ vars.ANTHROPIC_FEDERATION_RULE_ID }}
          ANTHROPIC_ORGANIZATION_ID: ${{ vars.ANTHROPIC_ORGANIZATION_ID }}
          ANTHROPIC_SERVICE_ACCOUNT_ID: ${{ vars.ANTHROPIC_SERVICE_ACCOUNT_ID }}
          ANTHROPIC_WORKSPACE_ID: ${{ vars.ANTHROPIC_WORKSPACE_ID }}
          NEWS_SUMMARY_MODEL: ${{ vars.NEWS_SUMMARY_MODEL }}
        run: |
          pip install --quiet certifi 'anthropic>=1.8,<2'
          RD=$(python -c "import json;print(json.load(open('kr/data/kr_market_data.json'))['report_date'])")
          python scripts/fetch_telegram.py --market kr --datadir kr/data --bodydir _workspace/telegram --date "$RD"
      - name: Report status
        run: |
          python - <<'PY'
          import json
          d = json.load(open('kr/data/kr_market_data.json'))
          print(f"report_date={d['report_date']} complete={d['complete']}")
          if d['missing']:
              print('missing:', ', '.join(d['missing']))
          PY
      - name: Commit data
        # 판 관리 1단계(2026-11-10): 오늘과 같은 경로로 커밋 O 를 만든 뒤 원격 최신 위에 다시 세워 push 한다.
        # 실행 원본은 versions/kr/<D>/runs/<run_id>/ 에 남는다. 모드는 레포 Variable KR_VERSIONS_MODE —
        # 없으면 shadow(고정 경로는 오늘과 같은 바이트, 기록만). enforce 는 발행된 날의 값을 발행 커밋으로
        # 둔다 — 켜는 것은 사용자 확인 뒤. 판정이 실패하면 오늘 방식(push_with_retry.sh)으로 내려가고
        # ::warning:: 과 폴백 기록을 남긴다(보호 비활성). spec: docs/superpowers/specs/2026-11-10-kr-data-versions.md
        env:
          KR_VERSIONS_MODE: ${{ vars.KR_VERSIONS_MODE || 'shadow' }}
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          RD=$(python -c "import json;print(json.load(open('kr/data/kr_market_data.json'))['report_date'])")
          FORCE=""
          if [ "${{ inputs.force }}" = "true" ]; then FORCE="--force"; fi
          python scripts/common/versions.py commit --market kr --mode "$KR_VERSIONS_MODE" \
            --message "data: kr market data for ${RD}" $FORCE
      - name: Keep run copy (artifact)
        # 커밋·push 가 실패해도 이 실행의 원본이 남는다(보존 90일).
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kr-versions-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/versions
          if-no-files-found: ignore
          retention-days: 90
