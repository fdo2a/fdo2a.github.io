name: Probe push trigger (temporary)

# 2.5단계 시험(2026-11-08) — 사용자 push 와 루틴(Claude) push 가 각각 push 이벤트로 작업 흐름을 깨우는지 기록만 한다.
# 비밀값 없음, 체크아웃 없음, 쓰기 없음(연쇄 실행 없음). 11/10 US 발행까지 관찰한 뒤 지운다.
# 설계: 프로젝트 루트 design-2.5-github-cloudflare.md(v5 probe 절)
on:
  push:
    branches: [main]
    paths:
      - 'posts/**'
      - 'kr/posts/**'
      - 'ops/probe.txt'

permissions:
  contents: read

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Record what woke this run
        env:
          EVENT: ${{ github.event_name }}
          ACTOR: ${{ github.actor }}
          TRIGGERING: ${{ github.triggering_actor }}
          PUSHER: ${{ github.event.pusher.name }}
          SHA: ${{ github.sha }}
          BEFORE: ${{ github.event.before }}
          RUN_ID: ${{ github.run_id }}
          ADDED: ${{ join(github.event.commits.*.added, ' ') }}
          MODIFIED: ${{ join(github.event.commits.*.modified, ' ') }}
        run: |
          echo "event=$EVENT actor=$ACTOR triggering_actor=$TRIGGERING pusher=$PUSHER"
          echo "sha=$SHA before=$BEFORE run_id=$RUN_ID"
          echo "added=$ADDED"
          echo "modified=$MODIFIED"
